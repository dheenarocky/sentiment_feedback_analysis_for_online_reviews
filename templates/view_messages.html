<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url("{{ url_for('static', filename='background.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        body::before {
            content: "";
            background: rgba(0, 0, 0, 0.6);
            /* Dark overlay */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            margin: 30px;
            background-color: rgba(0, 0, 0, 0.75);
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.6);
        }

        .content {
            opacity: 0;
            transform: translateY(20px);
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }

        .content.visible {
            opacity: 1;
            transform: translateY(0);
        }

        h1 {
            color: #bbf305;
            margin-bottom: 20px;
            font-family: 'Trebuchet MS', sans-serif;
            font-size: 36px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
            text-shadow: 2px 2px 20px rgb(218, 7, 7);
            border-bottom: 2px solid #bbf305;
            padding-bottom: 10px;
            text-align: center;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background-color: #ffffffdd;
            border-radius: 10px;
            overflow: hidden;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
            color: #333;
        }

        th {
            background-color: #007BFF;
            color: white;
            font-size: 1.1em;
        }

        tr:nth-child(even) {
            background-color: #f9f9f9;
        }

        tr:hover {
            background-color: #f0ff8b75;
        }

        .btn-delete {
            color: white;
            background-color: #dc3545;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }

        .btn-delete:hover {
            background-color: #c82333;
        }

        .logout-button {
            display: inline-block;
            padding: 10px 15px;
            background-color: #007BFF;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            font-size: 1em;
            transition: background-color 0.3s;
        }

        .logout-button:hover {
            background-color: #0056b3;
        }

        .no-messages {
            text-align: center;
            font-size: 1.2em;
            color: #ccc;
        }
        .btn-reply {
            color: white;
            background-color: #28a745;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }

        .btn-reply:hover {
            background-color: #218838;
        }

        .btn-solved {
            color: white;
            background-color: #17a2b8;
            border: none;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 5px;
            font-size: 1em;
        }

        .btn-solved:hover {
            background-color: #046464;
        }

        .solved {
            background-color: #fce300aa !important;
        }
    </style>
    <script>
         window.onload = function() {
                const content = document.querySelector('.content');
                content.classList.add('visible');
            };

        function redirectToEmail(email) {
            window.location.href = `/email?recipient=${encodeURIComponent(email)}`;
        }

        function markAsSolved(row, messageId) {
            // Add the 'solved' class to the row
            row.classList.add('solved');

            // You can add an AJAX request here to update the message status in the database.
            // Example: 
            // fetch(`/mark_solved/${messageId}`, { method: 'POST' });

            // For now, just change the button to "Solved"
            const solvedButton = row.querySelector('.btn-solved');
            solvedButton.textContent = 'Replied ✔';
            solvedButton.disabled = true;  
        }
    </script>
</head>

<body>
    <div class="container">
        <div class="content">
        <h1>Contact Messages</h1>
        {% if messages %}
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Message</th>
                    <th>Date</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                {% for msg in messages %}
                <tr>
                    <td>{{ msg.id }}</td>
                    <td>{{ msg.name }}</td>
                    <td>{{ msg.email }}</td>
                    <td>{{ msg.message }}</td>
                    <td>{{ msg.timestamp_ist }}</td>
                    <td>
                        <button class="btn-reply" onclick="redirectToEmail('{{ msg.email }}')">Reply&nbsp</button>
                        <form action="/delete_message/{{ msg.id }}" method="POST" style="display:inline;"
                            onsubmit="return confirm('Are you sure you want to delete this message?');">
                            <button type="submit" class="btn-delete">Delete</button>
                        </form>
                        <button class="btn-solved" onclick="markAsSolved(this.closest('tr'), {{ msg.id }})">Mark as Replied</button>
                    </td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
        {% else %}
        <p class="no-messages">No messages found.</p>
        {% endif %}
        </div>
    </div>
    <div style="text-align: center; margin: 10px;">
        <a href="{{ url_for('admin_login') }}" class="logout-button">Logout</a>
    </div>
</body>

</html>
