<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reply to Message</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <style>
        /* General Styling */
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: url("{{ url_for('static', filename='background.jpg') }}") no-repeat center center fixed;
            background-size: cover;
            color: #fff;
        }

        body::before {
            content: "";
            background: rgba(0, 0, 0, 0.7);
            /* Dark overlay */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .container {
            max-width: 600px;
            margin: 100px auto;
            padding: 30px;
            background: rgba(0, 0, 0, 0.85);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }

        h1 {
            text-align: center;
            color: #afaf4c;
            font-size: 2em;
            text-shadow: 2px 2px 20px rgb(218, 7, 7);
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
            color: #fff;
        }

        .content {
            opacity: 0;
            transform: translateY(20px);
            transition: transform 0.5s ease-in-out, opacity 0.5s ease-in-out;
        }

        .content.visible {
            opacity: 1;
            transform: translateY(0);
        }
        
        input[type="text"],
        textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 5px;
            border: none;
            font-size: 1.1em;
            background: #f4f4f4;
            color: #333;
        }

        textarea {
            height: 150px;
        }

        input:focus,
        textarea:focus {
            outline: none;
            box-shadow: 0 0 5px rgba(255, 242, 0, 0.7);
        }

        /* Loading Screen */
        #loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            flex-direction: column;
            color: white;
            text-align: center;
        }

        .spinner {
            border: 8px solid #f3f3f3;
            border-radius: 50%;
            border-top: 8px solid #3498db;
            width: 60px;
            height: 60px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .loading-message {
            font-size: 20px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 10px;
            animation: fadeIn 2s infinite;
        }

        @keyframes fadeIn {

            0%,
            100% {
                opacity: 0.6;
            }

            50% {
                opacity: 1;
            }
        }

        .btn-submit,.btn-clear {
            width: 50%;
            padding: 12px;
            border: none;
            border-radius: 5px;
            font-size: 1.1em;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-submit:hover {
            background-color: #00b336;
            transform: scale(1.05);
        }

        .btn-clear:hover {
            background-color: #ff0000;
            transform: scale(1.05);
        }

        .button-container {
            display: flex;
            justify-content: center; 
            gap: 20px; 
            width: 100%; 
            justify-content: center; 
        }

        .back-link {
            color: #ffd700;
            font-weight: bold;
            text-decoration: none;
            text-align: center;
        }

        .back-link:hover {
            text-decoration: underline;
        }
        
    </style>
</head>

<body>
    <div class="container">
        <div class="content">
        <h1>Reply to Message</h1>
        <form method="POST" onsubmit="showLoadingScreen()">
            <label for="recipient">To:</label>
            <input type="text" id="recipient" name="recipient" value="{{ recipient }}" readonly>

            <label for="subject">Subject:</label>
            <input type="text" id="subject" name="subject" placeholder="Enter subject" value="Reply from ProjectTeam - (Sentimental Analysis Review System)" readonly>

            <label for="message">Message:</label>
            <textarea id="message" name="message" placeholder="Enter your message" required></textarea>
            <div class="button-container">
            <button type="submit" class="btn-submit">Send Email</button><br><br>
            <button type="button" class="btn-clear" onclick="clearForm()">Clear</button>
            </div>
        </form>
        <center><a href="{{ url_for('view_messages') }}" class="back-link">Back</a></center>
        </div>
    </div>
        <!-- Loading Screen -->
        <div id="loading-screen">
            <div class="spinner"></div>
            <p id="loading-message" class="loading-message">Checking for network connectivity. . .</p>
        </div>

    <script>
        window.onload = function() {
                const content = document.querySelector('.content');
                content.classList.add('visible');
            };
        function showLoadingScreen() {     
            const loadingScreen = document.getElementById('loading-screen');
            const loadingMessage = document.getElementById('loading-message');

            loadingScreen.style.display = 'flex';

            const messages = [
                "Sending Email. . .",
                "Almost Done. . .",
                "Response sent successfully!",
                "Reconnecting. . .",
                "Checking for network connectivity. . .",
                "Sending Email. . .",
                "Almost Done. . .",
            ];

            let index = 0;
            setInterval(() => {
                if (index < messages.length) {
                    loadingMessage.textContent = messages[index];
                    index++;
                }
            }, 1750);
        }
        function clearForm() {
            document.querySelector('form').reset(); // Reset the form fields
        }
    </script>
</body>

</html>
